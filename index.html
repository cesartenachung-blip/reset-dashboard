<html lang="es">
<head>
<meta charset="UTF-8">

<title>Reset | Agua Viva Surco</title>

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --navy:#14205c; --navy2:#1E2761; --ink:#0f1840; --gold:#D4AF37; --gold2:#c9a227; --ice:#CADCFC;
  --bg:#eef2fb; --card:#fff; --line:#d8e0f2; --muted:#5b6690; --text:#16204a; --head:#1E2761; --headtxt:#fff; --sub:#e7edfb;
  --ok:#1f8a5b; --okbg:#d8f2e5; --mid:#c77a12; --midbg:#fff0d1; --low:#b3261e; --lowbg:#fbe0de;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0c1336; --card:#141d4a; --line:#26316b; --muted:#9aa6d6; --text:#e9eeff; --sub:#1b2660; --okbg:#173f33; --midbg:#43361a; --lowbg:#4a1f22; --ok:#6fd3a5; --mid:#f0b75a; --low:#ff8c84; } }
:root[data-theme="dark"]{ --bg:#0c1336; --card:#141d4a; --line:#26316b; --muted:#9aa6d6; --text:#e9eeff; --sub:#1b2660; --okbg:#173f33; --midbg:#43361a; --lowbg:#4a1f22; --ok:#6fd3a5; --mid:#f0b75a; --low:#ff8c84; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
.n,.big,.stat b,.ringtxt{font-family:"Archivo Narrow",Archivo,system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{background:linear-gradient(120deg,var(--ink),var(--navy2) 65%,#2b2a6e);color:#fff;padding:20px clamp(14px,4vw,40px) 0}
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;max-width:1280px;margin:0 auto}
.brand{display:flex;gap:16px;align-items:center}
.brand img{height:64px;width:64px;border-radius:14px;box-shadow:0 0 0 2px rgba(212,175,55,.55)}
.brand h1{margin:0;font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.brand p{margin:4px 0 0;color:var(--ice);font-size:14px}
.brand p span+span::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin:0 10px 2px}
.stamps{font-size:12.5px;color:var(--ice);text-align:right;line-height:1.5}
.stamps b{color:#fff;font-weight:600}
nav.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;justify-content:space-between;max-width:1280px;margin:18px auto 0}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{background:transparent;border:0;color:var(--ice);font:600 15px Archivo,sans-serif;padding:12px 18px;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--bg);color:var(--text)}
.btn{border:0;border-radius:10px;padding:10px 16px;font:600 14px Archivo,sans-serif;cursor:pointer;margin-bottom:8px}
.btn.gold{background:var(--gold);color:var(--ink)} .btn.gold:hover{background:#e2bf4d}
.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:1280px;margin:0 auto;padding:22px clamp(12px,3vw,40px) 48px}
.banner{background:#fff6dc;color:#6b4d00;border:1px solid #f0d58a;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.summary{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:14px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.sum h2{margin:0;font-size:17px;font-weight:700}
.sum.total{background:var(--navy);color:#fff;border-color:var(--navy)}
.sum.total h2{color:var(--gold)}
.sum .main{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%}
.ringtxt{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700}
.sum .lead{margin:0;font-size:14px;color:var(--muted)}
.sum.total .lead{color:var(--ice)}
.sum .lead b{display:block;font:700 40px/1 "Archivo Narrow",sans-serif;color:var(--text);margin-bottom:4px}
.sum.total .lead b{color:#fff;font-size:48px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.sum.total .stats{border-color:rgba(255,255,255,.18)}
.stat small{display:block;font-size:12px;color:var(--muted)}
.sum.total .stat small{color:var(--ice)}
.stat b{font-size:22px;font-weight:700}
.stat.wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline}
.stat.wide b{font-size:16px}
.tables{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 6px 8px;min-width:0}
.tw{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
thead th{background:var(--head);color:var(--headtxt);font-weight:700;font-size:12.5px;padding:7px 8px;text-align:center;white-space:nowrap}
thead tr:first-child th:first-child{border-top-left-radius:10px} thead tr:first-child th:last-child{border-top-right-radius:10px}
thead tr.s th{background:var(--sub);color:var(--text);font-weight:600}
thead th.l{text-align:left}
thead th.yr{border-left:2px solid var(--card)}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n{text-align:center}
td.code{color:var(--muted);font-size:12.5px}
td.tot{font-weight:700;background:rgba(212,175,55,.12)}
td.logro{background:var(--sub)}
tr.zero td{color:var(--muted)}
tbody tr:hover td{background:rgba(202,220,252,.25)}
tfoot td{font-weight:700;border-bottom:0;background:var(--sub)}
tfoot td:first-child{border-bottom-left-radius:10px} tfoot td:last-child{border-bottom-right-radius:10px}
.av{display:inline-block;min-width:54px;text-align:center;border-radius:20px;padding:2px 8px;font:700 12.5px "Archivo Narrow",sans-serif}
.av.hi{background:var(--okbg);color:var(--ok)} .av.md{background:var(--midbg);color:var(--mid)} .av.lo{background:var(--lowbg);color:var(--low)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--ice);color:var(--navy);margin-left:6px}
.empty{color:var(--muted);font-size:14px;padding:12px}
.hidden{display:none!important}
dialog{border:0;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 24px);color:var(--text);background:var(--card)}
dialog::backdrop{background:rgba(10,15,45,.55)}
.dlg{padding:22px}
.dlg h3{margin:0 0 6px;font-size:20px}
.dlg p{margin:6px 0;color:var(--muted);font-size:14px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.chip{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.chip b{display:block;font:700 24px "Archivo Narrow",sans-serif}.chip small{color:var(--muted)}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.dlg .btn{margin:0}.dlg .btn.line{background:transparent;border:1px solid var(--line);color:var(--text)}
.dlg input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--text)}
.warnlist{font-size:13px;color:var(--mid);margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9;max-width:calc(100% - 24px)}
.det{padding:14px 16px}
.det h2{margin:0 0 12px;font-size:17px}.det h2 em{font-style:normal;color:var(--muted);font-weight:500;font-size:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--text)}
#tabDet td.n{text-align:left}
@media (max-width:1060px){.summary{grid-template-columns:1fr 1fr}.sum.total{grid-column:1/-1}}
@media (max-width:640px){nav.bar .btn{order:-1}.summary{grid-template-columns:1fr}.stamps{text-align:left}.brand img{height:48px}.sum .lead b{font-size:34px}}
@media print{nav.bar .btn{display:none}body{background:#fff}}
</style>
</head>

<script>
// ===== Datos de respaldo (copia de los Excel en Drive al 12/10/2026). Se usan solo si la API no responde. =====
const FALLBACK = {
  principal:{modifiedTime:null,leaders:[
    ["C181","JAIME SANCHEZ",0],["C182","MOISES GARCIA",0],["C183","JEAMPIER ALBITRES",0],["C184","JESUS RODRIGUEZ",0],["C185","RICHARD HANCCO",0],["C186","CESAR TENA",2],["C187","LUIS HERRERA",1],["C188","DIEGO CARLOS",1],["C189","FREDDY VENTOCILLA",2],["C18A","MANUEL ANGELES",0],["C18B","JOSUE GUILLEN",0],["C18C","MELQUIADES BELLIDO",0],["C18D","JAVIER CABRERA",0],["C18E","HUMBERTO MONTENEGRO",0],["C18F","KARLA CARDENAS",0],["C18H","JOSE LAZARO",0],["C18I","TOMAS TITO",0],["C18J","DIEGO GARCIA NEXT",9],["C18M","FERMIN VERA",0],
    ["C281","LUZ CAMPOS",0],["C282","GABY GARCIA",2],["C283","ELIZABETH VALENZUELA",0],["C284","MARTHA VILLEGAS",0],["C285","CECILIA HANCCO",0],["C286","ALEXANDRA TENA",3],["C287","ALYSSA HURTADO",3],["C288","MAYÚ CALLUPE",2],["C289","ERICKA LAZARO DE V.",4],["C28A","ISABEL ILDEFONSO DE A.",0],["C28B","ANY GUILLEN",0],["C28C","GLADYS PAUCAR DE B.",0],["C28D","ANA CABRERA",0],["C28E","SOLEDAD RAMIREZ DE M.",0],["C28F","KARLA CARDENAS",0],["C28H","ELSI GOMEZ",0],["C28I","BELLSY SUAZO",0],["C28J","BRIGITTE MONTOYA NEXT",32],["C28K","ANDREA CHOQUE",0],["C28L","MARCELA VILLEGAS",0],["C28M","MARIA ESTHER VERA",2]]},
  next:{modifiedTime:null,leaders:[
    ["C18J1","CARLOS SABOYA",0],["C18J2","JEYSON MOLINA",0],["C18J3","ADRIAN PARIONA",0],["C18J4","MARTIN CORDOVA",0],["C18J5","RODOLFO MOLINA",0],["C18J6","JEFFERSON JARA",0],["C18J7","LUIS LA ROSA",0],["C18J8","DERECK PACHAS",0],["C18J9","RICARDO GOMEZ",0],["C18JA","JHONATAN VEGA",0],["C18JB","LUIS CASTRO",0],["C18JC","ALEXANDER SILVA",0],["C18JD","BRYAN MENDIZABAL",1],["C18JE","ALEF GUIOP",6],["C18JF","JOEL SOTO",0],["C18JG","JOHEY PERDOMO",1],
    ["C28J1","YISELL PEDREROS",2],["C28J2","GIANELLA SAAVEDRA",0],["C28J3","YSABEL BALDOSEDA",21],["C28J4","SARAIM SANCHEZ",1],["C28J5","CLAUDIA AREVALO",4],["C28J6","JOSELIN SOLIS",0],["C28J7","ANA ESQUECHE",0],["C28J8","MILAGROS ANCCA",0],["C28J9","TIZZIANA CONTRERAS",0],["C28JA","YAMELI AVILA",1],["C28JB","TIRSA JESUS",1],["C28JC","ASTRID JESUS",1]]}
};
const MESES=['SEP','OCT','NOV','DIC'];
const MES_NUM={'09':'SEP','10':'OCT','11':'NOV','12':'DIC'};
const $=id=>document.getElementById(id);
const fmt=n=>(n||0).toLocaleString('es-PE');
const pct=(a,b)=>b?Math.round(a*100/b):0;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=t=>new Date(t).toLocaleString('es-PE',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});
let DATA=null, VIEW='principal', DETALLE=[], PENDING=null, LOADED_AT=null;

function normFallback(){
  const o={};for(const k in FALLBACK){o[k]={modifiedTime:null,leaders:FALLBACK[k].leaders.map(([code,name,logro])=>({code,name,logro,sexo:code.startsWith('C18')?'H':'M',SEP:0,OCT:0,NOV:0,DIC:0,total:0}))}}
  return o;
}
function toast(msg,ms=3500){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function banner(msg){const b=$('banner');if(!msg){b.classList.add('hidden');return}b.textContent=msg;b.classList.remove('hidden')}
function setStamps(){
  LOADED_AT=new Date();
  $('stamp').innerHTML='Datos de Drive al <b>'+dt(LOADED_AT)+'</b>';
  const m=VIEW!=='detalle'?DATA?.[VIEW]?.modifiedTime:[DATA?.principal?.modifiedTime,DATA?.next?.modifiedTime].filter(Boolean).sort().pop();
  $('stamp2').textContent=m?'Archivo modificado '+dt(m):'';
}

async function loadData(){
  $('stamp').textContent='Cargando datos…';
  try{
    const r=await fetch('/api/data',{cache:'no-store'});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||r.status);
    DATA=j; banner(''); setStamps();
  }catch(e){
    DATA=normFallback();
    banner('No se pudo leer Drive ('+e.message+'). Se muestra la copia de respaldo del 12/10/2026.');
    $('stamp').textContent='Copia de respaldo'; $('stamp2').textContent='';
  }
  render();
}

// ===== Render dashboard =====
const sum=(a,k)=>a.reduce((s,l)=>s+(l[k]||0),0);
function ring(p,light){
  const c=p>=100?'var(--ok)':p>=50?'#D4AF37':'#e0614f';
  return `<div class="ring"><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15.9" fill="none" stroke="${light?'rgba(255,255,255,.15)':'var(--line)'}" stroke-width="3.4"/><circle cx="18" cy="18" r="15.9" fill="none" stroke="${light?'#D4AF37':c}" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="${Math.min(p,100)} 100" transform="rotate(-90 18 18)"/></svg><span class="ringtxt">${p}%</span></div>`;
}
function card(title,rows,light){
  const t=sum(rows,'total'),g=sum(rows,'logro'),sin=rows.filter(l=>!l.total).length;
  return `<h2>${title}</h2><div class="main">${ring(pct(t,g),light)}<p class="lead"><b>${fmt(t)}</b>inscritos en 2026-3 de ${fmt(g)} logrados en 2026-2</p></div>
  <div class="stats">${MESES.map(m=>`<div class="stat"><small>${m[0]+m.slice(1).toLowerCase()}</small><b>${fmt(sum(rows,m))}</b></div>`).join('')}
  <div class="stat wide"><small>Líderes sin inscritos</small><b>${sin} de ${rows.length}</b></div></div>`;
}
function render(){
  if(DATA&&LOADED_AT) setStamps();
  if(VIEW==='detalle'){renderDet();return}
  const L=DATA[VIEW].leaders, H=L.filter(l=>l.sexo==='H'), M=L.filter(l=>l.sexo==='M');
  const label=VIEW==='principal'?'Equipo Principal':'Equipo Next';
  $('sT').innerHTML=card(label+' en total',L,true);
  $('sH').innerHTML=card('Hombres',H);
  $('sM').innerHTML=card('Mujeres',M);
  const pre=VIEW==='principal'?'':'NEXT ';
  $('tabH').innerHTML=table(H,pre+'HOMBRES'); $('tabM').innerHTML=table(M,pre+'MUJERES');
}
function av(t,g){if(!g)return t?'<span class="av hi">nuevo</span>':'<span class="av">–</span>';const v=pct(t,g);return `<span class="av ${v>=100?'hi':v>=50?'md':'lo'}">${v}%</span>`}
function table(rows,title){
  const s=k=>sum(rows,k);
  return `<thead><tr><th class="l" rowspan="2">COD</th><th class="l" rowspan="2">${title}</th><th class="yr">2026-2</th><th class="yr" colspan="5">2026-3</th><th class="yr" rowspan="2">AVANCE</th></tr>
  <tr class="s"><th class="yr">LOGRO</th>${MESES.map((m,i)=>`<th${i?'':' class="yr"'}>${m}</th>`).join('')}<th>TOTAL</th></tr></thead><tbody>`+
  rows.map(l=>`<tr class="${l.total?'':'zero'}"><td class="code">${l.code}</td><td>${esc(l.name)}</td><td class="n logro">${l.logro||''}</td>${MESES.map(m=>`<td class="n">${l[m]||''}</td>`).join('')}<td class="n tot">${l.total}</td><td class="n">${av(l.total,l.logro)}</td></tr>`).join('')+
  `</tbody><tfoot><tr><td>Total</td><td></td><td class="n">${s('logro')}</td>${MESES.map(m=>`<td class="n">${s(m)}</td>`).join('')}<td class="n">${s('total')}</td><td class="n">% Inscritos ${pct(s('total'),s('logro'))}%</td></tr></tfoot>`;
}

// ===== Detalle =====
function leaderFor(code,eq){let best=null;for(const l of (DATA?.[eq]?.leaders||[]))if(code.startsWith(l.code)&&(!best||l.code.length>best.code.length))best=l;return best}
function renderDet(){
  const fm=$('fMes').value, fe=$('fEq').value, ft=$('fTxt').value.trim().toUpperCase();
  let rows=DETALLE.map(r=>{const p=leaderFor(r.code,'principal'),n=leaderFor(r.code,'next');return{...r,eq:n?'next':'principal',lider:(n||p)?.name||'Sin líder (otra sede)'}});
  if(fm) rows=rows.filter(r=>r.mes===fm); if(fe) rows=rows.filter(r=>r.eq===fe);
  if(ft) rows=rows.filter(r=>(r.code+' '+r.lider+' '+r.alumno).toUpperCase().includes(ft));
  $('detInfo').textContent=DETALLE.length?`${rows.length} de ${DETALLE.length} registros del último PDF cargado`:'sube un PDF para ver el detalle';
  $('tabDet').innerHTML=DETALLE.length?`<thead><tr><th>Grupo</th><th>Líder</th><th>Inscrito</th><th>Fecha</th><th>Mes</th><th>Equipo</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="code">${r.code}</td><td>${esc(r.lider)}</td><td>${esc(r.alumno)}</td><td class="n">${r.fecha}</td><td>${r.mes==='OTRO'?'<span class="pct md">otro</span>':r.mes}</td><td>${r.eq==='next'?'Next':'Principal'}</td></tr>`).join('')}</tbody>`:'<tbody><tr><td class="empty">Sin registros. El detalle no se guarda en Drive: solo se ve en esta sesión, después de subir el PDF.</td></tr></tbody>';
}
['fMes','fEq','fTxt'].forEach(id=>$(id).addEventListener('input',renderDet));

// ===== Lectura del PDF =====
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const CODE_G=/\bC[12]8[0-9A-Z]{1,3}\b/gi;
const DATE_G=/\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/g;
async function pdfRows(file){
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; const rows=[];
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await (await pdf.getPage(p)).getTextContent(); const items=tc.items.filter(i=>i.str.trim());
    const lines=[];
    for(const it of items){const y=it.transform[5],x=it.transform[4];let ln=lines.find(l=>Math.abs(l.y-y)<3);if(!ln){ln={y,items:[]};lines.push(ln)}ln.items.push({x,s:it.str.trim()})}
    lines.sort((a,b)=>b.y-a.y).forEach(l=>{l.items.sort((a,b)=>a.x-b.x);rows.push(l.items)});
  }
  return rows;
}
function parseRows(rows){
  let fechaX=null; const out=[]; let pend=null;
  const txt=r=>r.map(i=>i.s).join(' ');
  for(const r of rows){
    const t=txt(r);
    const hs=r.filter(i=>/^FECHA/i.test(i.s)&&!/NAC/i.test(i.s)); if(hs.length&&!/\d{4}[-\/]\d/.test(t)){fechaX=(hs.find(i=>/^FECHA$/i.test(i.s))||hs[hs.length-1]).x;continue}
    const codes=(t.match(CODE_G)||[]).map(c=>c.toUpperCase());
    const dates=[];
    r.forEach(i=>{for(const m of i.s.matchAll(DATE_G))dates.push({x:i.x,y:+m[1],m:m[2].padStart(2,'0'),d:m[3].padStart(2,'0')})});
    let date=null;
    if(dates.length){
      if(fechaX!=null) date=[...dates].sort((a,b)=>Math.abs(a.x-fechaX)-Math.abs(b.x-fechaX))[0];
      else date=dates.filter(d=>d.y>=2025).pop()||dates[dates.length-1];
    }
    if(codes.length&&date){out.push(mk(codes[0],date,t));pend=null}
    else if(codes.length){pend={code:codes[0],t}}
    else if(date&&pend){out.push(mk(pend.code,date,pend.t+' '+t));pend=null}
  }
  return out;
}
function mk(code,d,t){
  const fecha=`${d.y}-${d.m}-${d.d}`;
  const alumno=t.replace(CODE_G,' ').replace(DATE_G,' ').replace(/\b\d[\d\s-]{5,}\b/g,' ').replace(/\S*@\S*/g,' ').replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ' .]/g,' ').replace(/\s+/g,' ').trim().slice(0,60);
  return {code,fecha,mes:MES_NUM[d.m]||'OTRO',alumno,key:t.replace(/\s+/g,' ').toUpperCase()};
}

$('btnUpload').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const files=[...e.target.files]; e.target.value=''; if(!files.length)return;
  toast('Leyendo PDF…',2000);
  try{
    let recs=[];for(const f of files) recs=recs.concat(parseRows(await pdfRows(f)));
    const seen=new Set(); recs=recs.filter(r=>!seen.has(r.key)&&seen.add(r.key));
    if(!recs.length){toast('No se encontraron filas con código de líder y fecha en el PDF.',5000);return}
    DETALLE=recs; PENDING=recs;
    const sede=recs.filter(r=>leaderFor(r.code,'principal')||leaderFor(r.code,'next'));
    const c={SEP:0,OCT:0,NOV:0,DIC:0,OTRO:0}; sede.forEach(r=>c[r.mes]++);
    $('dTitle').textContent='Revisar carga';
    $('dText').textContent=`${files.length>1?files.length+' PDF, ':''}${recs.length} registros leídos; ${sede.length} pertenecen a líderes de Sede Surco. Se actualizarán SEP, OCT, NOV, DIC y TOTAL de los líderes que aparecen en el PDF (LOGRO no se toca).`;
    $('dChips').innerHTML=MESES.map(m=>`<div class="chip"><b>${c[m]}</b><small>${m}</small></div>`).join('');
    const w=[]; if(c.OTRO) w.push(`${c.OTRO} registros con fecha fuera de SEP a DIC no se cuentan.`);
    if(recs.length-sede.length) w.push(`${recs.length-sede.length} registros son de otras sedes y no se cuentan.`);
    $('dWarn').textContent=w.join(' ');
    $('dSave').disabled=false; $('dlg').showModal();
  }catch(err){toast('No se pudo leer el PDF: '+err.message,5000)}
};
$('dCancel').onclick=()=>{$('dlg').close();if(DETALLE.length)toast('Carga cancelada. El detalle queda visible en esta sesión.')};
$('dSave').onclick=async()=>{
  $('dSave').disabled=true; $('dSave').textContent='Guardando…';
  try{
    const headers={'Content-Type':'application/json'}; const k=$('dKey').value; if(k) headers['x-upload-key']=k;
    const r=await fetch('/api/data',{method:'POST',headers,body:JSON.stringify({records:PENDING.filter(x=>x.mes!=='OTRO').map(x=>({code:x.code,mes:x.mes}))})});
    const j=await r.json();
    if(r.status===401){$('dKeyWrap').classList.remove('hidden');$('dText').textContent='Ingresa la clave de carga para guardar.';return}
    if(!r.ok) throw new Error(j.error||r.status);
    DATA=j.data; $('dlg').close(); banner(''); render();
    setStamps();
    toast(`Guardado en Drive: ${j.summary.principal.lideresActualizados} líderes en Principal y ${j.summary.next.lideresActualizados} en Next.`,5000);
  }catch(err){toast('No se guardó en Drive: '+err.message,6000)}
  finally{$('dSave').disabled=false;$('dSave').textContent='Guardar en Drive'}
};

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));
  VIEW=b.dataset.view; $('vDash').classList.toggle('hidden',VIEW==='detalle'); $('vDet').classList.toggle('hidden',VIEW!=='detalle'); render();
});
loadData();
</script>
